<!-- Sign-up confirmation email. Used by local Supabase (config.toml) and
     pasted into the hosted project: Authentication > Emails > Confirm signup. -->
<div style="font-family: Arial, sans-serif; max-width: 480px; margin: 0 auto; color: #222;">
  <h2 style="margin-bottom: 8px;">Confirm your email</h2>
  <p>Your Palna code is:</p>
  <p style="font-size: 32px; font-weight: bold; letter-spacing: 8px; margin: 16px 0;">{{ .Token }}</p>
  <p>Enter this code in the app to finish creating your account. It expires in 1 hour.</p>

  <p style="color: #777; font-size: 13px; margin-top: 24px;">
    If you didn't create a Palna account, you can ignore this email.
  </p>
</div>
