name: baby_app
description: "A new Flutter project."
publish_to: 'none'
# name+build. Raise the name (1.0.0 -> 1.0.1 / 1.1.0) for each store release;
# both stores reject a new release with a name that is already live. Codemagic
# sets the build number itself (last store build + 1, or this one if higher),
# so only raise +N by hand for an .aab uploaded from this PC.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  crypto: ^3.0.7
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_timezone: ^5.1.0
  go_router: ^18.0.1
  google_sign_in: ^7.2.0
  home_widget: ^0.10.0
  intl: ^0.20.2
  package_info_plus: ^10.2.1
  path_provider: ^2.1.6
  pdf: ^3.13.1
  powersync: ^2.4.0
  share_plus: ^13.3.0
  sign_in_with_apple: ^8.2.0
  sqlite_async: ^0.14.5
  supabase_flutter: ^2.17.2
  timezone: ^0.11.1
  url_launcher: ^6.3.2
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/who_growth.json
    - assets/foods.json
    - assets/milestones.json

  # Bundled so text looks right offline. Licences: assets/fonts/OFL-*.txt
  fonts:
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora-Regular.ttf
        - asset: assets/fonts/Lora-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Lora-Bold.ttf
          weight: 700
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
    - family: NotoNastaliqUrdu
      fonts:
        - asset: assets/fonts/NotoNastaliqUrdu-Regular.ttf
        - asset: assets/fonts/NotoNastaliqUrdu-Bold.ttf
          weight: 700

# App icon: regenerate with `dart run flutter_launcher_icons` after changing
# the images (made by tool/icon/make_icon.py).
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: assets/icon/icon_background.png
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  adaptive_icon_monochrome: assets/icon/icon_monochrome.png
  remove_alpha_ios: true
