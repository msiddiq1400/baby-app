<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · Palna</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#fbf7f0">
  <!-- Served by Cloudflare for any missing address, so paths are absolute. -->
  <script>
    (function () {
      var r = document.documentElement;
      try {
        var t = localStorage.getItem('palna-theme');
        if (t) r.dataset.theme = t;
        var l = localStorage.getItem('palna-lang') || (/^ur/i.test(navigator.language || '') ? 'ur' : 'en');
        r.dataset.lang = l;
        if (l !== 'en') r.classList.add('i18n-pending');
        if (l === 'ur') { r.lang = 'ur'; r.dir = 'rtl'; } else if (l === 'roman') { r.lang = 'ur-Latn'; }
      } catch (e) {}
    })();
  </script>
  <link rel="icon" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@600&family=Noto+Nastaliq+Urdu:wght@400;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="lost">
  <div>
    <img src="/icon-192.png" alt="" width="120" height="120">
    <h1 data-i18n="lost.title">This page isn't here</h1>
    <p data-i18n="lost.text">The link may be old. Start again from the home page.</p>
    <p><a class="btn" href="/" data-i18n="lost.home">Go to the home page</a></p>
  </div>
</main>
<script src="/i18n.js"></script>
<script src="/site.js"></script>
</body>
</html>
