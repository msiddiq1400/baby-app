# Codemagic builds the iPhone app on its Macs (there is no Mac here) and
# uploads it to TestFlight, and builds the Android app for Google Play.
#
# Both start by themselves on every push to main (a merged pull request) that
# changes app/. Merges that only touch the website, server or docs build
# nothing, and a commit message with [skip ci] skips them too. They can still
# be started by hand: Codemagic > baby-app > Start new build. Feature branches
# never build.
#
# Versioning: the version name (1.0.0) comes from app/pubspec.yaml; raise it
# there for each store release. The build number is set here: the store's
# latest build + 1, or pubspec's +N if that is higher. So every upload gets a
# new number and nothing needs bumping by hand for Codemagic builds.
#
# Needs, in Codemagic > Team settings:
#   - Integrations > Developer Portal: the App Store Connect API key, named
#     "Palna App Store Connect".
#   - Environment variables, group "palna_prod": SUPABASE_URL,
#     SUPABASE_PUBLISHABLE_KEY, POWERSYNC_URL, GOOGLE_WEB_CLIENT_ID,
#     GOOGLE_IOS_CLIENT_ID, REVENUECAT_APPLE_KEY, REVENUECAT_GOOGLE_KEY
#     (the same values as app/env/prod.json; the RevenueCat ones are public
#     SDK keys and may stay empty until paid plans are set up), and
#     CERTIFICATE_PRIVATE_KEY (the signing key in stuff/, kept secret), and
#     GCLOUD_SERVICE_ACCOUNT_CREDENTIALS (JSON key of a Google Cloud service
#     account invited in Play Console > Users and permissions, with release
#     rights for Palna).
#   - Code signing identities > Android keystores: stuff/palna-upload.jks
#     (with its passwords and alias from app/android/key.properties),
#     reference name "palna_upload".
workflows:
  ios-testflight:
    name: iPhone to TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: app
    triggering: &on_main
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    when: &app_changed
      changeset:
        includes:
          - "app/"
    integrations:
      app_store_connect: Palna App Store Connect
    environment:
      flutter: 3.44.9
      xcode: latest
      cocoapods: default
      groups:
        - palna_prod
      vars:
        BUNDLE_ID: com.palnacare.app
        APP_STORE_APP_ID: 6817859227
    scripts:
      - &write_env
        name: Write env/prod.json
        script: |
          mkdir -p env
          jq -n \
            --arg url "$SUPABASE_URL" \
            --arg key "$SUPABASE_PUBLISHABLE_KEY" \
            --arg ps "$POWERSYNC_URL" \
            --arg web "$GOOGLE_WEB_CLIENT_ID" \
            --arg ios "$GOOGLE_IOS_CLIENT_ID" \
            --arg rcApple "${REVENUECAT_APPLE_KEY:-}" \
            --arg rcGoogle "${REVENUECAT_GOOGLE_KEY:-}" \
            '{SUPABASE_URL: $url, SUPABASE_PUBLISHABLE_KEY: $key, POWERSYNC_URL: $ps,
              GOOGLE_WEB_CLIENT_ID: $web, GOOGLE_IOS_CLIENT_ID: $ios,
              REVENUECAT_APPLE_KEY: $rcApple, REVENUECAT_GOOGLE_KEY: $rcGoogle}' > env/prod.json
      - name: Signing certificate and profile
        # Creates the App Store certificate and profile on first run (from
        # CERTIFICATE_PRIVATE_KEY) and reuses them afterwards.
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Get packages
        script: flutter pub get
      - name: Build the app
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" 2>/dev/null || echo 0)
          PUBSPEC=$(sed -n 's/^version: .*+//p' pubspec.yaml)
          BUILD=$(( LATEST + 1 > PUBSPEC ? LATEST + 1 : PUBSPEC ))
          echo "Build number $BUILD"
          flutter build ipa --release \
            --build-number=$BUILD \
            --dart-define-from-file=env/prod.json \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - "**/build/ios/ipa/*.ipa"
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Internal testers get each build without Apple's review. Turn this on
        # (and add beta_groups) once TestFlight > Test Information is filled in
        # and there is an external group with a public link.
        submit_to_testflight: false

  android-play:
    name: Android to Google Play
    instance_type: mac_mini_m2 # the free plan has Mac machines only
    max_build_duration: 60
    working_directory: app
    triggering: *on_main
    when: *app_changed
    environment:
      flutter: 3.44.9
      groups:
        - palna_prod
      android_signing:
        - palna_upload
      vars:
        PACKAGE_NAME: com.palnacare.app
    scripts:
      - *write_env
      - name: Signing key
        # android/app/build.gradle.kts signs release builds with this.
        script: |
          cat > android/key.properties <<EOF
          storeFile=$CM_KEYSTORE_PATH
          storePassword=$CM_KEYSTORE_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          keyPassword=$CM_KEY_PASSWORD
          EOF
      - name: Get packages
        script: flutter pub get
      - name: Build the app bundle
        script: |
          LATEST=$(google-play get-latest-build-number --package-name "$PACKAGE_NAME" 2>/dev/null || echo 0)
          PUBSPEC=$(sed -n 's/^version: .*+//p' pubspec.yaml)
          BUILD=$(( LATEST + 1 > PUBSPEC ? LATEST + 1 : PUBSPEC ))
          echo "Build number $BUILD"
          flutter build appbundle --release \
            --build-number=$BUILD \
            --dart-define-from-file=env/prod.json
    artifacts:
      - build/app/outputs/bundle/release/*.aab
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        # Play only accepts drafts until the app's first release is out;
        # roll the draft out in Play Console. Set false after that so internal
        # testers get each build straight away.
        submit_as_draft: true
        # Play refuses to send changes for review automatically while the
        # Console has other unsent changes (store listing, countries, ...).
        # Upload and save the release; send it for review in Play Console.
        changes_not_sent_for_review: true
