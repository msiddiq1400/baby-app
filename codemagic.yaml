# Codemagic builds the iPhone app on its Macs (there is no Mac here) and
# uploads it to TestFlight. Start it by hand: Codemagic > baby-app >
# Start new build > "iPhone to TestFlight".
#
# Needs, in Codemagic > Team settings:
#   - Integrations > Developer Portal: the App Store Connect API key, named
#     "Palna App Store Connect".
#   - Environment variables, group "palna_prod": SUPABASE_URL,
#     SUPABASE_PUBLISHABLE_KEY, POWERSYNC_URL, GOOGLE_WEB_CLIENT_ID,
#     GOOGLE_IOS_CLIENT_ID (the same values as app/env/prod.json), and
#     CERTIFICATE_PRIVATE_KEY (the signing key in stuff/, kept secret).
workflows:
  ios-testflight:
    name: iPhone to TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: app
    integrations:
      app_store_connect: Palna App Store Connect
    environment:
      flutter: 3.44.9
      xcode: latest
      cocoapods: default
      groups:
        - palna_prod
      vars:
        BUNDLE_ID: com.palnacare.app
        APP_STORE_APP_ID: 6817859227
    scripts:
      - name: Write env/prod.json
        script: |
          mkdir -p env
          jq -n \
            --arg url "$SUPABASE_URL" \
            --arg key "$SUPABASE_PUBLISHABLE_KEY" \
            --arg ps "$POWERSYNC_URL" \
            --arg web "$GOOGLE_WEB_CLIENT_ID" \
            --arg ios "$GOOGLE_IOS_CLIENT_ID" \
            '{SUPABASE_URL: $url, SUPABASE_PUBLISHABLE_KEY: $key, POWERSYNC_URL: $ps,
              GOOGLE_WEB_CLIENT_ID: $web, GOOGLE_IOS_CLIENT_ID: $ios}' > env/prod.json
      - name: Signing certificate and profile
        # Creates the App Store certificate and profile on first run (from
        # CERTIFICATE_PRIVATE_KEY) and reuses them afterwards.
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Get packages
        script: flutter pub get
      - name: Build the app
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" 2>/dev/null || echo 0)
          flutter build ipa --release \
            --build-number=$((LATEST + 1)) \
            --dart-define-from-file=env/prod.json \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - "**/build/ios/ipa/*.ipa"
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
